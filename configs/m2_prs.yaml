# Module 2: PRS-313 reclassification, European (CEU) vs Pakistani reference (O1).
# Genotypes: gnomAD v3.1.2 HGDP+1KG callset (CEU, PJL, 8 HGDP groups jointly called on GRCh38; D-19).
# Run everything (Linux/Colab/Mac with bcftools + plink2):
#   python -m module2_prs.run --config configs/m2_prs.yaml --step all
# Colab: notebooks/m2_prs_colab.ipynb
seed: 42
n_boot: 1000

# All relative paths below are resolved under data_root (override with --data-root).
data_root: "data"
results_dir: "results/m2_prs"

paths:
  weights: "prs/PGS000004_hmPOS_GRCh38.txt.gz"     # PGS Catalog harmonised, GRCh38 (CLAUDE.md, D-19)
  gnomad_meta: "genomics/gnomad/gnomad.genomes.v3.1.2.hgdp_1kg_subset_sample_meta.tsv.bgz"
  work_dir: "genomics/prs313"
  samples_list: "genomics/prs313/samples.txt"
  sample_sheet: "genomics/prs313/sample_sheet.csv"
  genotype_prefix: "genomics/prs313/merged"          # plink2 pfile written by --step extract
  target_pvar: null                                  # default: <genotype_prefix>.pvar
  read_freq: null
  sscore: null                                       # default: <results_dir>/prs313.sscore

genotype_build: "GRCh38"     # must match the weights; check_build() stops on a mismatch
fileset: "pfile"
plink2_path: "plink2"        # Windows: full path to plink2.exe
bcftools_path: "bcftools"
chr_prefix: "chr"            # gnomAD names chromosomes chr1..chr22

# Public, tabix-indexed; only the 313 positions are fetched (~MBs of 3.63 TB). Listed 2026-11-07.
vcf_url_template: "https://storage.googleapis.com/gcp-public-data--gnomad/release/3.1.2/vcf/genomes/gnomad.genomes.v3.1.2.hgdp_tgp.{chr}.vcf.bgz"
gnomad_meta_url: "https://storage.googleapis.com/gcp-public-data--gnomad/release/3.1.2/vcf/genomes/gnomad.genomes.v3.1.2.hgdp_1kg_subset_sample_meta.tsv.bgz"
pass_only: true              # keep only sites passing gnomAD variant QC

# Sample filters (gnomAD flags). Result on 2026-11-07: CEU 121, PJL 97, HGDP Pakistani 176
# (Pakistani pooled 273), 394 in total.
require_high_quality: true
drop_related: true
ancestry_n_pcs: 2
ancestry_k_sd: 4.0

# Palindromic A/T, C/G SNPs: keep (assume forward strand) | drop. PROPOSED: keep (D-14).
ambiguous: "keep"

ceu_label: "CEU"
pakistani_groups: [PJL, Balochi, Brahui, Burusho, Hazara, Kalash, Makrani, Pathan, Sindhi]

# Lower bound of each category on the reference percentile scale (fitted normal). PROPOSED (D-14).
categories:
  low: 0.0
  average: 0.20
  elevated: 0.80
  high: 0.99
