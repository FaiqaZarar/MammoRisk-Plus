# Validation label registry: one entry per output the platform can show.
# Every result shown in the UI or printed in the PDF MUST reference one of these keys
# (enforced in app/labels.py). This is how the platform "states its own reliability" (O5).
#
# Fill in `value`, `ci`, `source` and set `status: validated` ONLY from a real result logged in
# docs/STATUS.md (dataset, split, checkpoint, config, W&B run). Never type a number from memory.
#
# status: not_yet_validated | validated | exploratory
#
# short:   display name used in the reliability matrix and the dashboard.
# regions: where the datasets come from (US CN IN VN EU PK). "planned" = dataset identified, shown as
#          validated ONLY once `status` says so; "reference" = a reference distribution, no outcomes.

m3_probability:
  output: "Malignancy probability (benign vs malignant)"
  short: "Malignancy probability"
  module: "Module 3: classifier"
  datasets: ["CBIS-DDSM (internal test, patient-level 20%)", "CMMD (external)", "DMID (external)"]
  populations: ["USA (scanned film)", "China", "India"]
  not_validated_on: ["Pakistani women", "Normal (lesion-free) mammograms: model only separates benign from malignant lesions"]
  metric: "AUC (95% CI)"
  value: null
  ci: null
  status: not_yet_validated
  source: null
  regions: {US: planned, CN: planned, IN: planned}

m3_heatmap:
  output: "Explanation heatmap (Grad-CAM / Score-CAM)"
  short: "Explanation heatmap"
  module: "Module 3: explanations"
  datasets: ["CBIS-DDSM", "VinDr-Mammo", "DMID"]
  populations: ["USA", "Vietnam", "India"]
  not_validated_on: ["Pakistani women"]
  metric: "Pointing Game hit rate; energy-in-box"
  value: null
  ci: null
  status: not_yet_validated
  source: null
  regions: {US: planned, VN: planned, IN: planned}

m1_mirai_risk:
  output: "1–5 year breast cancer risk (Mirai, pre-trained)"
  short: "Mirai 1–5 year risk"
  module: "Module 1: Mirai"
  datasets: ["EMBED open 20% subset (external validation)"]
  populations: ["USA, racially diverse; Asian subgroup small"]
  not_validated_on: ["Pakistani women", "Non-Hologic machines may differ (Mirai trained on Hologic)"]
  metric: "IPCW C-index; 1–5 yr time-dependent AUC (95% CI)"
  value: null
  ci: null
  status: not_yet_validated
  source: null
  regions: {US: planned}

m2_prs_ceu:
  output: "PRS-313 standardised against a European (CEU) reference"
  short: "PRS-313, European reference"
  module: "Module 2: PRS-313"
  datasets: ["1000 Genomes CEU (reference)", "PGS Catalog PGS000004 weights"]
  populations: ["European ancestry (Utah, CEU)"]
  not_validated_on: ["Pakistani women: no cancer outcomes; category may shift under a Pakistani reference"]
  metric: "Reference distribution only (no outcome validation)"
  value: null
  ci: null
  status: not_yet_validated
  source: null
  regions: {EU: reference}

m2_prs_pak:
  output: "PRS-313 standardised against a Pakistani reference"
  short: "PRS-313, Pakistani reference"
  module: "Module 2: PRS-313"
  datasets: ["1000 Genomes PJL", "HGDP: 8 Pakistani groups (pooled, ~280)"]
  populations: ["Pakistani (pooled 9 groups)"]
  not_validated_on: ["Cancer outcomes: no outcome data; we do not claim which category is clinically correct"]
  metric: "Reference distribution only (no outcome validation)"
  value: null
  ci: null
  status: not_yet_validated
  source: null
  regions: {PK: reference}
