{# Small inline icons (24px grid, stroke follows currentColor). Usage: {{ icon("dna") }} #}
{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "dashboard" %}<rect x="3" y="3" width="7.5" height="9" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="5" rx="1.5"/><rect x="13.5" y="11" width="7.5" height="10" rx="1.5"/><rect x="3" y="15" width="7.5" height="6" rx="1.5"/>
{%- elif name == "mammogram" %}<path d="M4 4h6c5 1.5 9 5 10 9.5.5 3-1.5 6.500-5 6.500H4z"/><circle cx="13.500" cy="11" r="2.200"/>
{%- elif name == "mirai" %}<rect x="3" y="3" width="8" height="8" rx="1.500"/><rect x="13" y="3" width="8" height="8" rx="1.500"/><rect x="3" y="13" width="8" height="8" rx="1.500"/><rect x="13" y="13" width="8" height="8" rx="1.500"/>
{%- elif name == "dna" %}<path d="M7 3c0 6 10 6 10 12s-10 6-10 6"/><path d="M17 3c0 6-10 6-10 12"/><path d="M8.800 7h6.400M8.800 17h6.400" />
{%- elif name == "evidence" %}<path d="M12 3l7.500 3v5.500c0 4.500-3.200 8-7.500 9.500-4.300-1.500-7.500-5-7.500-9.500V6z"/><path d="M8.800 12l2.200 2.200 4.200-4.400"/>
{%- elif name == "logout" %}<path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 8l-4 4 4 4M6 12h10"/>
{%- elif name == "report" %}<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>
{%- elif name == "upload" %}<path d="M12 16V5M7.500 9.500L12 5l4.500 4.500"/><path d="M5 19h14"/>
{%- elif name == "moon" %}<path d="M20 14.500A8 8 0 0 1 9.500 4 8 8 0 1 0 20 14.500z"/>
{%- elif name == "sun" %}<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.600 5.600l1.400 1.400M17 17l1.400 1.400M18.400 5.600L17 7M7 17l-1.400 1.400"/>
{%- elif name == "lock" %}<rect x="5" y="10.500" width="14" height="10" rx="2"/><path d="M8 10.500V8a4 4 0 0 1 8 0v2.500"/>
{%- endif -%}
</svg>
{%- endmacro %}
