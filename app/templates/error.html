{% extends "base.html" %}
{% block title %}{{ title }} · {{ super() }}{% endblock %}
{% block content %}
<section class="error-page">
  <p class="error-code" aria-hidden="true">{{ code }}</p>
  <h1>{{ title }}</h1>
  <p class="lead">{{ hint }}</p>
  {% if detail %}<p class="muted">{{ detail }}</p>{% endif %}
  <div class="actions">
    <a class="btn btn-primary" href="{{ url_for('main.dashboard') if session.user else url_for('main.index') }}">
      {{ "Back to dashboard" if session.user else "Back to start" }}</a>
  </div>
</section>
{% endblock %}
